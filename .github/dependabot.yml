# Weekly dependency updates, grouped so there are only a few PRs a week.
# Dependabot PRs skip the "Version bumped" CI check (see ci.yml and CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Minor and patch updates land as one PR per group. Majors get their own PR.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
