name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # CLAUDE.md: every PR bumps the version in package.json and adds a CHANGELOG entry.
  # Dependabot can't do that, so its PRs skip this check (a skipped job still counts as passing).
  version-bump:
    name: Version bumped
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          head=$(node -p "require('./package.json').version")
          base=$(git show "origin/${BASE_REF}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "base version: $base, this PR: $head"
          if [ "$head" = "$base" ]; then
            echo "::error file=package.json::Bump the version in package.json (see CLAUDE.md): it is still $base."
            exit 1
          fi
          if ! grep -q "^## $head\$" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add a '## $head' entry to CHANGELOG.md."
            exit 1
          fi
